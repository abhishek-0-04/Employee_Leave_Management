spring.application.name=employee-leave-management

# MySQL configuration - change only the password for your local installation.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_leave_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema.sql file creates the tables. Hibernate then validates the mapping.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SQL scripts are not automatically executed because credentials/schema may already exist.
spring.sql.init.mode=never

server.port=8080

# Development CORS origin.
app.cors.allowed-origin=http://localhost:4200
